definitions:
  controllers.StartAgentRequest:
    properties:
      role:
        type: string
      task:
        type: string
    required:
    - role
    - task
    type: object
  controllers.StartAgentResponse:
    properties:
      agent_id:
        type: string
      message:
        type: string
    type: object
  controllers.UserRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  worker.WorkerProgressNotification:
    description: Progress notification containing the agent ID and progress message
    properties:
      agent_id:
        description: The ID of the agent reporting progress
        type: string
      progress:
        description: The progress message content
        type: string
    type: object
  worker.WorkerResponseNotification:
    description: Response notification containing the agent ID and response message
    properties:
      agent_id:
        description: |-
          The ID of the agent sending the response
          @Description Unique identifier of the agent
        type: string
      response:
        description: |-
          The response message content
          @Description Response message from the agent
        type: string
    type: object
  worker.WorkerStatusNotification:
    description: Status notification containing the agent ID and status message
    properties:
      agent_id:
        description: The ID of the agent reporting the status
        type: string
      status:
        description: The status message content
        type: string
    type: object
  ws.WebSocketDataTypes:
    description: All websocket response data types
    properties:
      pong:
        description: '@Description: A pong message that just echo back.'
        type: string
      progress:
        allOf:
        - $ref: '#/definitions/worker.WorkerProgressNotification'
        description: '@Description: A worker progress notification.'
      response:
        allOf:
        - $ref: '#/definitions/worker.WorkerResponseNotification'
        description: '@Description: A worker response notification.'
      status:
        allOf:
        - $ref: '#/definitions/worker.WorkerStatusNotification'
        description: '@Description: A worker status notification.'
    type: object
  ws.WsEventType:
    enum:
    - ping
    - pong
    - agent_response
    - agent_progress
    - agent_status
    type: string
    x-enum-varnames:
    - WsEventTypePing
    - WsEventTypePong
    - WsEventTypeAgentResponse
    - WsEventTypeAgentProgress
    - WsEventTypeAgentStatus
  ws.WsMessage:
    properties:
      data:
        allOf:
        - $ref: '#/definitions/ws.WebSocketDataTypes'
        description: '@Description: The data of the message. Each field is optional,
          depending on the event type.'
      event:
        allOf:
        - $ref: '#/definitions/ws.WsEventType'
        description: '@Description: The event type of the message.'
    type: object
host: localhost:8081
info:
  contact:
    email: roackb2@gmail.com
    name: Jay / Fienna Liang
    url: https://github.com/roackb2
  description: This is the API for the Lucid project.
  title: Lucid API
  version: "1.0"
paths:
  /api/v1/agents/create:
    post:
      consumes:
      - application/json
      description: Starts a new agent with role and task
      parameters:
      - description: Agent details
        in: body
        name: agent
        required: true
        schema:
          $ref: '#/definitions/controllers.StartAgentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Agent created successfully
          schema:
            $ref: '#/definitions/controllers.StartAgentResponse'
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start a new agent
      tags:
      - agents
  /api/v1/users:
    post:
      consumes:
      - application/json
      description: Creates a new user with the provided details
      parameters:
      - description: User details
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/controllers.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - users
  /healthz:
    get:
      description: Returns the health status of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check endpoint
      tags:
      - healthz
  /ws:
    get:
      description: |-
        Handles websocket connections and delegates to the ws package.
        The WebSocket connection is served at 8082 port.
        The response type lists all possible worker notifications.
      responses:
        "200":
          description: The response type lists all possible worker notifications.
          schema:
            items:
              $ref: '#/definitions/ws.WsMessage'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Handle websocket connections
      tags:
      - websocket
securityDefinitions:
  None:
    type: basic
swagger: "2.0"
